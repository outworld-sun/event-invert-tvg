[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtg-training"
version = "0.1.0"
description = "Video temporal grounding with dynamic video budgets and event preference learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.51.3",
  "deepspeed==0.18.9", "ninja>=1.11,<2",
  "peft==0.15.2", "accelerate==1.7.0", "spacy==3.8.7",
  "numpy==1.26.4", "av==17.0.1", "Pillow>=10,<12",
  "tqdm>=4.66,<5", "tensorboard==2.20.0", "einops>=0.8,<0.9",
]

[project.optional-dependencies]
dev = ["black==25.1.0", "build>=1.2,<2"]

[project.scripts]
vtg-train = "vtg.cli.train:main"
vtg-evaluate = "vtg.cli.evaluate:main"
vtg-prepare = "vtg.cli.prepare:main"
vtg-doctor = "vtg.cli.doctor:main"
vtg-calibrate = "vtg.cli.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
